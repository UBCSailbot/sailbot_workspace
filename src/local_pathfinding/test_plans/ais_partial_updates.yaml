# Regression scenario for the AIS list overwrite bug (issue #1031).
#
# Two ships are tracked from the start. At t=6s the mock AIS publishes a message carrying only
# ship 1, and at t=15s it publishes an empty list. Both are the degraded messages the CAN
# transceiver emits when multi-frame reassembly fails.
#
# Expected: both ships stay in state.obstacles through the whole run and are only removed after
# AIS_SHIP_TIMEOUT_SEC without a refresh. Before the fix they disappeared at t=6s and t=15s.

tw_dir_deg: 0
tw_speed_kmph: 10.0
heading_deg: 180.0

gps:
  latitude: 49.28
  longitude: -123.18
  speed_kmph: 15.0

ais:
  - {id: 1, lat: 49.30, lon: -123.20, heading: 90.0, speed: 20.0, rot: 30, width: 1.0, height: 1.0}
  - {id: 2, lat: 49.25, lon: -123.15, heading: 45.0, speed: 15.0, rot: -20, width: 2.0, height: 2.0}

global_path:
  waypoints:
    - {latitude: 48.158391, longitude: -130.253906}
    - {latitude: 48.121368, longitude: -137.022955}

events:
  mock_ais:
    # Partial snapshot: ship 2 is omitted but must remain tracked.
    - timestamp: 6.0
      ships:
        - {id: 1, lat: 49.31, lon: -123.21, heading: 180.0, speed: 10.0, rot: 0, width: 1.0, height: 1.0}
    # Empty snapshot: neither ship may be dropped.
    - timestamp: 15.0
      ships: []
