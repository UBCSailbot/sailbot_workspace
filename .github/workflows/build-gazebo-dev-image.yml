name: Build gazebo-dev Image

on:
    workflow_dispatch:
        inputs:
            tag:
                description: "Tag to publish the gazebo-dev image as"
                required: true
                type: string
            base_tag:
                description: "Tag of ghcr.io/ubcsailbot/sailbot_workspace/dev to build on top of"
                required: true
                type: string
                default: "setup-included-2"

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    docker:
        runs-on: ubuntu-latest
        timeout-minutes: 240

        steps:
            - name: Set up QEMU
              uses: docker/setup-qemu-action@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
              with:
                  platforms: linux/arm64,linux/amd64

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.PAT_TOKEN }}

            - name: Build and push gazebo-dev
              uses: docker/build-push-action@v7
              with:
                  context: "{{defaultContext}}"
                  file: .devcontainer/gazebo/gazebo.Dockerfile
                  build-args: |
                      BASE_TAG=${{ inputs.base_tag }}
                  push: true
                  tags: |
                      ghcr.io/ubcsailbot/sailbot_workspace/gazebo-dev:${{ inputs.tag }}
                      ghcr.io/ubcsailbot/sailbot_workspace/gazebo-dev:latest
                  platforms: linux/arm64,linux/amd64
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
